<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Lucky Reels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Bebas+Neue&display=block" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎰</text></svg>" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0520;
      touch-action: none;
    }

    /*
     * Phaser's Scale.FIT + CENTER_BOTH sizes the canvas to fit the parent,
     * then centers it using position:absolute + top/left offset.
     * The parent must be position:relative (or fixed) with explicit size.
     */
    #game-container {
      position: fixed;
      inset: 0;
    }

    #game-container canvas {
      display: block;
      image-rendering: auto;
    }

  </style>
</head>
<body>
  <div id="game-container"></div>
</body>
</html>
